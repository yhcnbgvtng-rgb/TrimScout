name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Every tracked *.test.* file must be run by `npm test` or be listed (with a reason) in test-known-failing.json.
      - name: Check every test file is run
        run: node scripts/check-test-coverage.mjs

      - name: Run tests
        run: npm test
